name: Update JSON from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *" # ogni 30 minuti

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate JSON (menu/events/reviews) from Google Sheets
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python sheets_to_json.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add data/menu.json data/events.json data/reviews.json
          git commit -m "chore: update data from Google Sheets"
          git push
